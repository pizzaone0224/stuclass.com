<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>목포덕인고 1-6 교실 — 급식 · 시간표 · 수행평가</title>
    <meta
      name="description"
      content="목포덕인고등학교 1학년 6반 교실 플랫폼 — 나이스 실시간 급식, 알레르기·최애 메뉴 맞춤 알림, 1-6 시간표, 학생 개인 페이지, 담임 관리"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f3ec;
        --surface: #ffffff;
        --surface-soft: #faf8f4;
        --surface-muted: #f3efe6;
        --border: #e2ddd2;
        --border-strong: #d4cec0;
        --ink: #1f2421;
        --ink-muted: #615b51;
        --ink-subtle: #787166;
        --chalk: #1c352a;
        --chalk-deep: #152b21;
        --teal: #0f766e;
        --teal-hover: #0d625b;
        --amber: #d97706;
        --amber-bg: #fef3c7;
        --amber-border: #fcd34d;
        --amber-ink: #92400e;
        --red: #dc2626;
        --red-bg: #fee2e2;
        --red-ink: #991b1b;
        --wood: #9c7148;
        --cork-frame: #b08a60;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg);
        color: var(--ink);
        font-family: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }

      button,
      input,
      select {
        font-family: inherit;
      }

      button {
        cursor: pointer;
      }

      .mono {
        font-family: 'JetBrains Mono', 'Noto Sans KR', monospace;
        font-variant-numeric: tabular-nums;
      }

      .app-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Top Bar (Strict 3-Zone) */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(250, 248, 244, 0.96);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--border);
      }

      .topbar-inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 20px;
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .wordmark {
        background: none;
        border: none;
        padding: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--chalk);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 24px;
        overflow-x: auto;
      }

      .nav-btn {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        padding: 6px 0;
        font-size: 14px;
        font-weight: 500;
        color: #645e54;
        white-space: nowrap;
        flex-shrink: 0;
        transition: color 0.15s, border-color 0.15s;
      }

      .nav-btn:hover {
        color: var(--ink);
      }

      .nav-btn.active {
        color: var(--ink);
        font-weight: 600;
        border-bottom-color: var(--teal);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 14px;
        border: 1px solid transparent;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 0.15s, border-color 0.15s, color 0.15s;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-chalk {
        background: var(--chalk);
        color: #fff;
      }
      .btn-chalk:hover:not(:disabled) {
        background: #27483a;
      }

      .btn-teal {
        background: var(--teal);
        color: #fff;
      }
      .btn-teal:hover:not(:disabled) {
        background: var(--teal-hover);
      }

      .btn-amber {
        background: var(--amber);
        color: #fff;
      }
      .btn-amber:hover:not(:disabled) {
        background: #b45309;
      }

      .btn-red {
        background: var(--red);
        color: #fff;
      }
      .btn-red:hover:not(:disabled) {
        background: #b91c1c;
      }

      .btn-outline {
        background: #fff;
        color: var(--ink);
        border-color: var(--border-strong);
      }
      .btn-outline:hover:not(:disabled) {
        background: var(--surface-soft);
      }

      .btn-outline-chalk {
        background: #fff;
        color: var(--chalk);
        border-color: var(--chalk);
      }
      .btn-outline-chalk:hover:not(:disabled) {
        background: var(--surface-muted);
      }

      .btn-soft {
        background: var(--surface-muted);
        color: #2d2a24;
      }
      .btn-soft:hover:not(:disabled) {
        background: #e7e0d2;
      }

      /* Main Container */
      .main-container {
        flex: 1;
        max-width: 1280px;
        width: 100%;
        margin: 0 auto;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 1px 2px rgba(31, 36, 33, 0.04);
      }

      .input {
        width: 100%;
        padding: 8px 12px;
        font-size: 13px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--surface-soft);
        color: var(--ink);
        outline: none;
      }
      .input:focus {
        border-color: var(--teal);
        background: #fff;
      }

      /* Grid Layouts */
      .grid-12 {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        align-items: start;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        align-items: start;
      }
      .grid-3 {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }

      @media (min-width: 960px) {
        .grid-2 {
          grid-template-columns: repeat(2, 1fr);
        }
        .grid-3 {
          grid-template-columns: repeat(3, 1fr);
        }
        .grid-timer {
          display: grid;
          grid-template-columns: 2fr 1fr;
          gap: 24px;
        }
        .grid-personal {
          display: grid;
          grid-template-columns: 7fr 5fr;
          gap: 24px;
          align-items: start;
        }
      }

      @media (min-width: 1180px) {
        .grid-12 {
          grid-template-columns: 7fr 5fr;
        }
      }

      /* Chalkboard Surface */
      .chalkboard-frame {
        border-radius: 12px;
        border: 4px solid var(--wood);
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(31, 36, 33, 0.08);
      }

      .chalkboard-surface {
        background-color: #1c352a;
        background-image: radial-gradient(circle at 22% 18%, rgba(255, 255, 255, 0.045) 0%, transparent 48%),
          radial-gradient(circle at 82% 75%, rgba(255, 255, 255, 0.03) 0%, transparent 52%);
        padding: 24px;
        color: #f5f7f2;
      }

      .chalk-ledge {
        height: 12px;
        background: linear-gradient(to bottom, #b7885c, #8c6139);
        border-top: 1px solid rgba(210, 167, 125, 0.5);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 32px;
        gap: 12px;
      }

      .chalk-piece {
        width: 30px;
        height: 5px;
        border-radius: 2px;
        opacity: 0.9;
      }

      .dish-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      @media (min-width: 600px) {
        .dish-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .dish-card {
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
      }
      .dish-card.fav {
        background: rgba(146, 64, 14, 0.42);
        border-color: rgba(252, 211, 77, 0.65);
      }
      .dish-card.warn {
        background: rgba(127, 29, 29, 0.48);
        border-color: rgba(252, 165, 165, 0.65);
      }

      /* Corkboard Surface */
      .corkboard-frame {
        border-radius: 12px;
        border: 4px solid var(--cork-frame);
        background-color: #ebe2d0;
        background-image: radial-gradient(rgba(120, 92, 58, 0.1) 1px, transparent 0),
          radial-gradient(rgba(160, 128, 90, 0.07) 1px, transparent 0);
        background-size: 18px 18px;
        background-position: 0 0, 9px 9px;
        padding: 20px;
        box-shadow: 0 2px 6px rgba(31, 36, 33, 0.06);
      }

      .paper-card {
        background: #fff;
        border: 1px solid #d4c7ae;
        border-radius: 8px;
        overflow: hidden;
      }

      /* Tables */
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 8px 6px;
        border-bottom: 1px solid #efe8d8;
      }

      .tt-cell-btn {
        width: 100%;
        min-height: 40px;
        padding: 4px;
        background: transparent;
        border: none;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        line-height: 1.25;
        font-size: 12px;
        color: var(--ink);
      }
      .tt-cell-btn:hover {
        background: var(--surface-muted);
      }
      .tt-cell-btn.today-cell {
        background: #fff;
        color: var(--teal);
        font-weight: 600;
        box-shadow: inset 0 0 0 1px rgba(15, 118, 110, 0.4);
      }

      .tt-teacher {
        font-size: 10px;
        color: var(--ink-muted);
        margin-top: 2px;
        font-weight: 400;
      }

      /* Segmented Control */
      .seg {
        display: inline-flex;
        align-items: center;
        border-radius: 6px;
        padding: 3px;
        gap: 2px;
      }
      .seg-dark {
        background: rgba(0, 0, 0, 0.28);
      }
      .seg-dark button {
        background: transparent;
        border: none;
        color: #c8ddd0;
        padding: 5px 11px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
      }
      .seg-dark button.active {
        background: #e9f5ee;
        color: var(--chalk-deep);
        font-weight: 600;
      }

      .seg-cork {
        background: #dfd3bd;
      }
      .seg-cork button {
        background: transparent;
        border: none;
        color: #5a4e3b;
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .seg-cork button.active {
        background: #fff;
        color: #251f17;
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }

      .seg-soft {
        background: #f5f2ea;
        display: flex;
        padding: 4px;
        border-radius: 6px;
      }
      .seg-soft button {
        flex: 1;
        background: transparent;
        border: none;
        color: #686157;
        padding: 6px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
      }
      .seg-soft button.active {
        background: #fff;
        color: var(--ink);
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }

      /* Chips & Badges (Zero-Pill: 4-6px radius) */
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        border: 1px solid transparent;
      }
      .chip-amber {
        background: var(--amber-bg);
        border-color: var(--amber-border);
        color: var(--amber-ink);
        font-weight: 600;
      }
      .chip-red {
        background: var(--red);
        color: #fff;
      }
      .chip-red-soft {
        background: var(--red-bg);
        color: var(--red-ink);
        font-weight: 600;
      }
      .chip-neutral {
        background: #f5f2ea;
        color: #45413a;
      }
      .chip-neutral:hover {
        background: #eae4d7;
      }
      .chip-chalk {
        background: rgba(255, 255, 255, 0.12);
        color: #e0efe6;
      }
      .chip-chalk:hover {
        background: rgba(255, 255, 255, 0.22);
      }

      .divider-row {
        border-bottom: 1px solid #f1ede4;
        padding: 12px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .divider-row:last-child {
        border-bottom: none;
      }

      .footer {
        border-top: 1px solid var(--border);
        background: var(--surface-soft);
        padding: 16px 20px;
        font-size: 12px;
        color: #6e675c;
      }
      .footer-inner {
        max-width: 1280px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .flex-wrap-gap {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .progress-track {
        width: 100%;
        height: 8px;
        background: #efebe2;
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        transition: width 0.2s ease;
      }

      .prd-pre {
        white-space: pre-wrap;
        font-family: inherit;
        font-size: 14px;
        line-height: 1.75;
        color: #262926;
        margin: 0;
      }

      @media (max-width: 720px) {
        .topbar-inner {
          flex-wrap: wrap;
          padding: 10px 14px;
          gap: 10px;
        }
        .nav-links {
          order: 3;
          width: 100%;
          gap: 16px;
        }
      }
    </style>

        function pad2(n) {
          return String(n).padStart(2, '0');
        }

        function formatYmd(date) {
          return date.getFullYear() + pad2(date.getMonth() + 1) + pad2(date.getDate());
        }

        function formatIsoDate(date) {
          return (
            date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate())
          );
        }

        function addDays(base, offset) {
          var next = new Date(base.getTime());
          next.setDate(next.getDate() + offset);
          return next;
        }

        function getTodayIsoOffset(days) {
          return formatIsoDate(addDays(new Date(), days));
        }

        function escapeHtml(str) {
          return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function splitSubjectAndTeacher(raw) {
          var text = String(raw || '').trim();
          var m = text.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
          if (m) return { subject: m[1].trim(), teacher: m[2].trim() };
          return { subject: text, teacher: '' };
        }

        function calculateDDay(dueDateIso) {
          var today = new Date();
          today.setHours(0, 0, 0, 0);
          var parts = String(dueDateIso || '').split('-').map(Number);
          var target = new Date(parts[0] || today.getFullYear(), (parts[1] || 1) - 1, parts[2] || 1);
          target.setHours(0, 0, 0, 0);
          var diffDays = Math.round((target.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
          if (diffDays === 0) return { label: 'D-DAY', diffDays: diffDays };
          if (diffDays > 0) return { label: 'D-' + diffDays, diffDays: diffDays };
          return { label: 'D+' + Math.abs(diffDays), diffDays: diffDays };
        }

        function parseNeisDishes(rawDishText) {
          if (!rawDishText) return [];
          return String(rawDishText)
            .split(/<br\s*\/?>|\n/gi)
            .map(function (line) {
              return line.trim();
            })
            .filter(Boolean)
            .map(function (line) {
              var match = line.match(/\(([0-9.]+)\)\s*$/);
              var allergies = [];
              var name = line;
              if (match) {
                allergies = match[1]
                  .split('.')
                  .map(function (n) {
                    return parseInt(n, 10);
                  })
                  .filter(function (n) {
                    return !isNaN(n) && n >= 1 && n <= 19;
                  });
                name = line.slice(0, match.index).trim();
              }
              name = name.replace(/[*@#]+$/g, '').trim();
              return { name: name, allergies: allergies };
            });
        }

        var mealFetchSeq = 0;

        function fetchNeisMeals() {
          var seq = ++mealFetchSeq;
          ui.mealLoading = true;
          ui.mealError = '';
          render();

          var ymd = formatYmd(ui.selectedDate);
          var url =
            'https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=5' +
            '&ATPT_OFCDC_SC_CODE=' +
            encodeURIComponent(db.school.officeCode) +
            '&SD_SCHUL_CODE=' +
            encodeURIComponent(db.school.schoolCode) +
            '&MLSV_YMD=' +
            encodeURIComponent(ymd);

          fetch(url)
            .then(function (res) {
              if (!res.ok) throw new Error('HTTP ' + res.status);
              return res.json();
            })
            .then(function (data) {
              if (seq !== mealFetchSeq) return;
              var rows =
                data && data.mealServiceDietInfo && data.mealServiceDietInfo[1]
                  ? data.mealServiceDietInfo[1].row
                  : null;
              if (!Array.isArray(rows) || rows.length === 0) {
                ui.meal = null;
                ui.mealLoading = false;
                render();
                return;
              }
              var matched =
                rows.find(function (r) {
                  return String(r.MMEAL_SC_CODE) === ui.mealCode;
                }) || null;
              if (!matched) {
                ui.meal = null;
              } else {
                ui.meal = {
                  date: ymd,
                  mealType: matched.MMEAL_SC_NM || '중식',
                  calories: matched.CAL_INFO || '정보 없음',
                  nutrition: matched.NTR_INFO ? String(matched.NTR_INFO).replace(/<br\s*\/?>/gi, ' · ') : '',
                  dishes: parseNeisDishes(matched.DDISH_NM || ''),
                };
              }
              ui.mealLoading = false;
              render();
            })
            .catch(function () {
              if (seq !== mealFetchSeq) return;
              ui.meal = null;
              ui.mealError =
                '나이스(NEIS) 급식 API에 연결하지 못했습니다. 인터넷 연결 상태를 확인해 주세요.';
              ui.mealLoading = false;
              render();
            });
        }

        function updateTimerDom() {

          if (disp) {

            var ss = pad2(ui.timerSeconds % 60);

          if (stat) {
            stat.textContent =
              ui.timerSeconds === 0
                ? '시간 종료!'
                : ui.timerRunning
                ? '집중 진행 중'
                : '시작 대기 중';
          }

        function toggleTimer() {
          if (ui.timerSeconds === 0) return;
          if (ui.timerRunning) {
            ui.timerRunning = false;
            clearInterval(ui.timerInterval);
            ui.timerInterval = null;
          } else {
            ui.timerRunning = true;
            ui.timerInterval = setInterval(function () {
              if (ui.timerSeconds <= 1) {
                ui.timerSeconds = 0;
                ui.timerRunning = false;
                clearInterval(ui.timerInterval);
                ui.timerInterval = null;
                render();
              } else {
                ui.timerSeconds -= 1;
                updateTimerDom();
              }
            }, 1000);
          }
          render();
        }

          ui.timerRunning = false;

          var sorted = db.tasks.slice().sort(function (a, b) {
            if (a.completed !== b.completed) return a.completed ? 1 : -1;
            return String(a.dueDate).localeCompare(String(b.dueDate));
          });
          var remainingCount = db.tasks.filter(function (t) {
            return !t.completed;
          }).length;

          var mm = pad2(Math.floor(ui.timerSeconds / 60));
          var ss = pad2(ui.timerSeconds % 60);

          return (
            '<div class="grid-timer">' +
            '  <section class="card">' +

            '      <div><div style="font-size:12px;color:var(--ink-muted)">학급 알림장</div><h3 style="margin:2px 0 0;font-size:17px;font-weight:700">수행평가 D-Day 위젯</h3></div>' +
            '      <span class="mono" style="font-size:12px;color:var(--ink-muted)">남은 일정 ' +

            '    <form data-form="add-task" style="margin-top:14px;display:flex;flex-wrap:wrap;gap:8px">' +
            '      <input class="input" style="width:115px" name="subject" maxlength="12" placeholder="과목 (예: 수학)" />' +
            '      <input class="input" style="flex:1;min-width:170px" name="title" maxlength="40" placeholder="수행평가 내용 (예: 탐구 보고서)" />' +
            '      <input class="input mono" style="width:150px" type="date" name="dueDate" value="' +
            formatIsoDate(new Date()) +
            '" />' +
            '      <button type="submit" class="btn btn-teal">' +
            icon('plus', 14) +
            '추가</button>' +
            '    </form>' +
            '    <div style="margin-top:14px">' +
            (sorted.length === 0
              ? '<p style="text-align:center;color:var(--ink-subtle);font-size:13px;padding:24px 0">등록된 수행평가가 없습니다.</p>'
              : sorted
                  .map(function (t) {
                    var dInfo = calculateDDay(t.dueDate);

                      '  <div style="display:flex;align-items:center;gap:10px;min-width:0">' +
                      '    <button type="button" data-action="toggle-task" data-id="' +
                      escapeHtml(t.id) +
                      '" style="background:none;border:none;padding:2px;color:' +
                      (t.completed ? 'var(--teal)' : '#b9b1a2') +
                      '">' +
                      (t.completed ? icon('check', 18) : '<span style="display:inline-block;width:16px;height:16px;border:2px solid #b9b1a2;border-radius:4px"></span>') +
                      '    </button>' +
                      '    <div style="min-width:0">' +
                      '      <div style="font-size:12px;color:var(--ink-muted)"><strong>' +
                      escapeHtml(t.subject) +
                      '</strong> · <span class="mono">' +
                      escapeHtml(t.dueDate) +
                      '</span></div>' +
                      '      <div style="font-size:14px;font-weight:500;' +
                      (t.completed ? 'text-decoration:line-through;color:#9a9386' : '') +
                      '">' +
                      escapeHtml(t.title) +
                      '</div>' +
                      '    </div>' +
                      '  </div>' +
                      '  <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">' +
                      '    <span class="mono" style="font-size:13px;font-weight:700;color:' +

                      '">' +
                      (t.completed ? '완료' : dInfo.label) +

                      '    <button type="button" data-action="delete-task" data-id="' +
                      escapeHtml(t.id) +
                      '" style="background:none;border:none;color:#9a9386;padding:4px" title="삭제">' +
                      icon('trash', 15) +
                      '</button>' +
                      '  </div>' +
                      '</div>'
                    );

                  .join('')) +
            '    </div>' +
            '  </section>' +
            '  <section class="card" style="display:flex;flex-direction:column;justify-content:space-between">' +
            '    <div>' +
            '      <div style="display:flex;justify-content:space-between;align-items:baseline;padding-bottom:14px;border-bottom:1px solid #efebe2">' +
            '        <div><div style="font-size:12px;color:var(--ink-muted)">교탁 시계</div><h3 style="margin:2px 0 0;font-size:17px;font-weight:700">쉬는시간 · 자습 타이머</h3></div>' +

            mm +
            ':' +
            ss +
            '</div>' +
            '      </div>' +
            '    </div>' +
            '    <div style="display:flex;gap:8px">' +
            '      <button type="button" data-action="timer-toggle" class="btn btn-teal" style="flex:1"' +
            (ui.timerSeconds === 0 ? ' disabled' : '') +

            icon(ui.timerRunning ? 'pause' : 'play', 14) +

            icon('reset', 14) +

            '    </div>' +
            '  </section>' +

            '">' +

            '</button>' +

            (ui.activeTab === 'prd' ? ' active' : '') +
            '" data-action="tab" data-tab="prd">PRD 기획서</button>' +
            '    </nav>' +

            '</main>' +
            '<footer class="footer">' +
            '  <div class="footer-inner">' +
            '    <span>목포덕인고등학교 1학년 6반 교실 · 단일 index.html 무빌드 버전 (로컬 더블클릭 · GitHub · Vercel 즉시 배포)</span>' +
            '    <div class="flex-wrap-gap">' +

              ? '<button type="button" class="btn btn-outline" style="padding:5px 10px;font-size:11px" data-action="download-html">' +
                icon('download', 12) +
                'GitHub용 index.html 저장</button>'

            '      <span>알레르기 및 식단 정보는 학교 급식실 사정에 따라 당일 변경될 수 있습니다.</span>' +

        // ============================================================
        // 8. EVENT DELEGATION (Clicks, Forms, File Upload, Timetable Edit)
        // ============================================================
        var appRoot = document.getElementById('app');

        appRoot.addEventListener('click', function (e) {
          var target = e.target.closest('[data-action]');
          if (!target) return;
          var action = target.getAttribute('data-action');

          if (action === 'tab') {
            ui.activeTab = target.getAttribute('data-tab') || 'classroom';
            ui.loginError = '';
            render();
            return;
          }

          if (action === 'logout') {
            db.session = { role: null, studentId: null };
            saveDb(db);
            ui.loginError = '';
            if (ui.activeTab === 'teacher') ui.activeTab = 'classroom';
            render();
            return;
          }

          if (action === 'meal-code') {
            ui.mealCode = target.getAttribute('data-code') || '2';
            fetchNeisMeals();
            return;
          }

          if (action === 'shift-date') {
            var days = Number(target.getAttribute('data-days') || '0');
            ui.selectedDate = addDays(ui.selectedDate, days);
            fetchNeisMeals();
            return;
          }

          if (action === 'reset-date') {
            ui.selectedDate = new Date();
            fetchNeisMeals();
            return;
          }

          if (action === 'toggle-school-search') {
            ui.showSchoolSearch = !ui.showSchoolSearch;
            render();
            return;
          }

          if (action === 'select-school') {
            var idx = Number(target.getAttribute('data-idx'));
            if (ui.schoolResults[idx]) {
              db.school = ui.schoolResults[idx];
              saveDb(db);
              ui.showSchoolSearch = false;
              fetchNeisMeals();
            }
            return;
          }

          if (action === 'toggle-all-allergies') {
            ui.showAllAllergies = !ui.showAllAllergies;
            render();
            return;
          }

          if (action === 'toggle-allergy') {
            var code = Number(target.getAttribute('data-code'));
            var st = getCurrentStudent();
            var arr = st ? st.allergies : db.guestAllergies;
            var pos = arr.indexOf(code);
            if (pos === -1) arr.push(code);
            else arr.splice(pos, 1);
            saveDb(db);
            render();
            return;
          }

          if (action === 'toggle-dish-fav') {
            var dishName = target.getAttribute('data-dish') || '';
            var stFav = getCurrentStudent();
            var favArr = stFav ? stFav.favoriteMenus : db.guestFavorites;
            var matchedKw = favArr.find(function (kw) {
              return dishName.toLowerCase().indexOf(kw.toLowerCase()) !== -1;
            });
            if (matchedKw) {
              var nextArr = favArr.filter(function (k) {
                return k !== matchedKw;
              });
              if (stFav) stFav.favoriteMenus = nextArr;
              else db.guestFavorites = nextArr;
            } else if (dishName) {
              favArr.push(dishName);
            }
            saveDb(db);
            render();
            return;
          }

          if (action === 'add-fav-kw') {
            var kw = (target.getAttribute('data-kw') || '').trim();
            var stAdd = getCurrentStudent();
            var list = stAdd ? stAdd.favoriteMenus : db.guestFavorites;
            if (kw && list.indexOf(kw) === -1) {
              list.push(kw);
              saveDb(db);
              render();
            }
            return;
          }

          if (action === 'remove-fav') {
            var rmKw = target.getAttribute('data-kw') || '';
            var stRm = getCurrentStudent();
            if (stRm) {
              stRm.favoriteMenus = stRm.favoriteMenus.filter(function (k) {
                return k !== rmKw;
              });
            } else {
              db.guestFavorites = db.guestFavorites.filter(function (k) {
                return k !== rmKw;
              });
            }
            saveDb(db);
            render();
            return;
          }

          if (action === 'set-rating') {
            ui.reviewRating = Number(target.getAttribute('data-score') || '5');
            render();
            return;
          }

          if (action === 'tt-mode') {
            ui.ttViewMode = target.getAttribute('data-mode') || 'grid';
            render();
            return;
          }

          if (action === 'toggle-tt-fullday') {
            ui.ttShowFullDay = !ui.ttShowFullDay;
            render();
            return;
          }

          if (action === 'edit-tt-classname') {
            ui.ttEditingClassName = true;
            render();
            return;
          }

          if (action === 'edit-tt-cell') {
            ui.ttEditingCell = {
              day: target.getAttribute('data-day'),
              periodIdx: Number(target.getAttribute('data-idx')),
            };
            render();
            return;
          }

          if (action === 'toggle-task') {
            var tid = target.getAttribute('data-id');
            db.tasks.forEach(function (t) {
              if (t.id === tid) t.completed = !t.completed;
            });
            saveDb(db);
            render();
            return;
          }

          if (action === 'delete-task') {
            var dtid = target.getAttribute('data-id');
            db.tasks = db.tasks.filter(function (t) {
              return t.id !== dtid;
            });
            saveDb(db);
            render();
            return;
          }

          if (action === 'timer-preset') {
            setTimerPreset(Number(target.getAttribute('data-mins') || '25'));
            return;
          }

          if (action === 'timer-toggle') {
            toggleTimer();
            return;
          }

          if (action === 'timer-reset') {
            setTimerPreset(ui.timerPreset);
            return;
          }

          if (action === 'toggle-personal-role-edit') {
            ui.personalEditingRole = !ui.personalEditingRole;
            render();
            return;
          }

          if (action === 'fill-role-preset') {
            var inp = document.getElementById('personal-role-input');
            if (inp) inp.value = target.getAttribute('data-preset') || '';
            return;
          }

          if (action === 'teacher-edit-open') {
            e.stopPropagation();
            var eid = target.getAttribute('data-id');
            ui.teacherSelectedId = eid;
            ui.teacherEditingId = eid;
            render();
            return;
          }

          if (action === 'teacher-edit-close') {
            ui.teacherEditingId = null;
            render();
            return;
          }

          if (action === 'teacher-delete-student') {
            e.stopPropagation();
            var dsid = target.getAttribute('data-id');
            delete db.students[dsid];
            if (db.session && db.session.studentId === dsid) {
              db.session = { role: null, studentId: null };
            }
            if (ui.teacherSelectedId === dsid) {
              ui.teacherSelectedId = Object.keys(db.students).sort()[0] || null;
            }
            saveDb(db);
            render();
            return;
          }

          if (action === 'teacher-select') {
            ui.teacherSelectedId = target.getAttribute('data-id');
            render();
            return;
          }

          if (action === 'teacher-delete-warning') {
            var wSid = target.getAttribute('data-sid');
            var wId = target.getAttribute('data-wid');
            var targetSt = db.students[wSid];
            if (targetSt) {
              targetSt.warningLogs = targetSt.warningLogs.filter(function (l) {
                return l.id !== wId;
              });
              targetSt.warningCount = targetSt.warningLogs.reduce(function (s, l) {
                return s + (l.points || 1);
              }, 0);
              saveDb(db);
              render();
            }
            return;
          }

          if (action === 'copy-prd') {
            if (navigator.clipboard) {
              navigator.clipboard.writeText(PRD_MARKDOWN).then(function () {
                ui.prdCopied = true;
                render();
                setTimeout(function () {
                  ui.prdCopied = false;
                  render();
                }, 1800);
              });
            }
            return;
          }

          if (action === 'download-prd') {
            var blob = new Blob([PRD_MARKDOWN], { type: 'text/markdown;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'PRD.md';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            return;
          }

          if (action === 'download-html') {
            fetch('/download/index.html')
              .then(function (r) {
                if (!r.ok) return fetch(window.location.pathname || './index.html');
                return r;
              })
              .then(function (r) {
                return r.text();
              })
              .then(function (htmlText) {
                var htmlBlob = new Blob([htmlText], { type: 'text/html;charset=utf-8' });
                var htmlUrl = URL.createObjectURL(htmlBlob);
                var link = document.createElement('a');
                link.href = htmlUrl;
                link.download = 'index.html';
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(htmlUrl);
              });
            return;
          }
        });

        appRoot.addEventListener('submit', function (e) {
          var form = e.target;
          var kind = form.getAttribute('data-form');
          if (!kind) return;
          e.preventDefault();

          if (kind === 'login') {
            var sid = String(form.studentId.value || '').trim();
            var pw = String(form.password.value || '').trim();
            if (!sid || !pw) {
              ui.loginError = '학번과 비밀번호를 모두 입력해 주세요.';
              render();
              return;
            }
            if (sid.toLowerCase() === 'kkt') {
              if (pw.toLowerCase() !== 'kkt') {
                ui.loginError = '담임 선생님 비밀번호가 올바르지 않습니다. (kkt 입력)';
                render();
                return;
              }
              db.session = { role: 'teacher', studentId: null };
              saveDb(db);
              ui.loginError = '';
              ui.activeTab = 'teacher';
              render();
              return;
            }
            var found = db.students[sid];
            if (!found) {
              ui.loginError =
                '등록되지 않은 학번입니다. (등록 명단: 10601, 10602, 10603, 10604, 10605, 10609, 10613, 10620, 10623)';
              render();
              return;
            }
            if (pw !== sid) {
              ui.loginError = '비밀번호가 올바르지 않습니다. (비밀번호는 본인의 학번과 동일합니다)';
              render();
              return;
            }
            db.session = { role: 'student', studentId: sid };
            saveDb(db);
            ui.loginError = '';
            render();
            return;
          }

          if (kind === 'school-search') {
            ui.schoolQuery = form.q.value;
            searchNeisSchools(ui.schoolQuery);
            return;
          }

          if (kind === 'tt-classname') {
            var nextName = String(form.className.value || '').trim();
            if (nextName) {
              db.timetable.className = nextName;
              saveDb(db);
            }
            ui.ttEditingClassName = false;
            render();
            return;
          }

          if (kind === 'review') {
            var comment = String(form.comment.value || '').trim();
            if (!comment) return;
            var st = getCurrentStudent();
            var author = st
              ? st.studentId + ' ' + st.name
              : String((form.author && form.author.value) || '').trim() || '1-6 학생';
            var now = new Date();
            db.reviews.unshift({
              id: 'rev-' + Date.now(),
              date: formatYmd(ui.selectedDate),
              author: author,
              rating: ui.reviewRating,
              comment: comment,
              createdAt: pad2(now.getHours()) + ':' + pad2(now.getMinutes()),
            });
            saveDb(db);
            render();
            return;
          }

          if (kind === 'add-fav') {
            var kw = String(form.keyword.value || '').trim();
            if (!kw) return;
            var stFav = getCurrentStudent();
            var favArr = stFav ? stFav.favoriteMenus : db.guestFavorites;
            if (favArr.indexOf(kw) === -1) {
              favArr.push(kw);
              saveDb(db);
            }
            render();
            return;
          }

          if (kind === 'add-task') {
            var subj = String(form.subject.value || '').trim();
            var title = String(form.title.value || '').trim();
            var due = String(form.dueDate.value || '').trim();
            if (!subj || !title || !due) return;
            db.tasks.push({
              id: 'task-' + Date.now(),
              subject: subj,
              title: title,
              dueDate: due,
              completed: false,
            });
            saveDb(db);
            render();
            return;
          }

          if (kind === 'personal-role') {
            var stRole = getCurrentStudent();
            if (!stRole) return;
            stRole.classPosition = String(form.classPosition.value || '일반 학생').trim();
            stRole.assignedRole = String(form.assignedRole.value || '').trim() || '미정';
            saveDb(db);
            ui.personalEditingRole = false;
            render();
            return;
          }

          if (kind === 'teacher-add-student') {
            var newId = String(form.studentId.value || '').trim();
            var newName = String(form.name.value || '').trim();
            var newPos = String(form.classPosition.value || '일반 학생').trim();
            var newRole = String(form.assignedRole.value || '').trim() || '미정';
            if (!newId || !newName) {
              ui.teacherCreateError = '학번과 이름을 모두 입력해 주세요.';
              render();
              return;
            }
            if (newId.toLowerCase() === 'kkt') {
              ui.teacherCreateError = 'kkt는 담임 선생님 전용 로그인 코드입니다.';
              render();
              return;
            }
            if (db.students[newId]) {
              ui.teacherCreateError = '이미 등록된 학번입니다.';
              render();
              return;
            }
            db.students[newId] = {
              studentId: newId,
              name: newName,
              classPosition: newPos,
              assignedRole: newRole,
              warningCount: 0,
              warningLogs: [],
              allergies: [],
              favoriteMenus: [],
            };
            saveDb(db);
            ui.teacherCreateError = '';
            ui.teacherSelectedId = newId;
            render();
            return;
          }

          if (kind === 'teacher-edit-role') {
            var editSt = db.students[ui.teacherEditingId];
            if (editSt) {
              editSt.classPosition = String(form.classPosition.value || '일반 학생').trim();
              editSt.assignedRole = String(form.assignedRole.value || '').trim() || '미정';
              saveDb(db);
            }
            ui.teacherEditingId = null;
            render();
            return;
          }

          if (kind === 'teacher-add-warning') {
            var sel = db.students[ui.teacherSelectedId];
            var reason = String(form.reason.value || '').trim();
            var wDate = String(form.date.value || formatIsoDate(new Date())).trim();
            var points = Number(form.points.value || '1');
            if (!sel || !reason) return;
            sel.warningLogs.unshift({
              id: 'warn-' + Date.now(),
              date: wDate,
              reason: reason,
              points: points,
            });
            sel.warningCount = sel.warningLogs.reduce(function (s, l) {
              return s + (l.points || 1);
            }, 0);
            saveDb(db);
            render();
          }
        });

        appRoot.addEventListener('change', function (e) {
          if (e.target && e.target.id === 'tt-photo-upload') {
            var file = e.target.files && e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function () {
              if (typeof reader.result === 'string' && reader.result) {
                db.timetable.photoUrl = reader.result;
                saveDb(db);
                ui.ttViewMode = 'photo';
                ui.ttMsg = '새 시간표 사진이 브라우저에 저장되었습니다.';
                render();
              }
            };
            reader.readAsDataURL(file);
          }
        });

        function commitCellInput(inputEl) {
          if (!ui.ttEditingCell) return;
          var day = inputEl.getAttribute('data-tt-day');
          var idx = Number(inputEl.getAttribute('data-tt-idx'));
          if (day && !isNaN(idx)) {
            if (!Array.isArray(db.timetable.periods[day])) db.timetable.periods[day] = [];
            while (db.timetable.periods[day].length < 8) db.timetable.periods[day].push('');
            db.timetable.periods[day][idx] = String(inputEl.value || '').trim();
            saveDb(db);
          }
          ui.ttEditingCell = null;
          render();
        }

        appRoot.addEventListener('keydown', function (e) {
          if (e.target && e.target.id === 'tt-cell-input') {
            if (e.key === 'Enter') {
              e.preventDefault();
              commitCellInput(e.target);
            } else if (e.key === 'Escape') {
              ui.ttEditingCell = null;
              render();
            }
          }
        });

        appRoot.addEventListener(
          'blur',
          function (e) {
            if (e.target && e.target.id === 'tt-cell-input') {
              commitCellInput(e.target);
            }
          },
          true
        );

        // ============================================================
        // 9. BOOTSTRAP
        // ============================================================
        render();
        fetchNeisMeals();
      })();
    </script>
  </body>
</html>
